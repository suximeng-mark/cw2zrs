name: Release Plugin
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '>=3.9'
          cache: 'pip'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Install dependencies
        run: pip install -e .

      - name: Build plugin packages
        # 用 tools/pack.py 而不是直接调 cw-plugin-pack：SDK 的排除集是
        # 硬编码的、不读 .gitignore，所以 tests/ 与 .github/ 会被打进产物
        # （tests/ 是提交进仓库的，CI 的干净 checkout 里也存在）。
        # 包装器打包前暂存这些目录、打完包还原，并自检产物里没有混入。
        # 本地也用同一个脚本，保证线上包与本地一致。
        run: python tools/pack.py

      - name: Publish to plugin registry
        # 广场是外部服务（plaza.cw.rinlit.cn），曾整站返回 402 DEPLOYMENT_DISABLED。
        # 产物本身已由上一步构建完成，广场只负责列表分发，
        # 因此这里不让它的抖动卡住 GitHub Release（真正的下载来源）。
        continue-on-error: true
        env:
          CWPT_TOKEN: ${{ secrets.CWPT_TOKEN }}
        run: cw-plugin-publish

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Generate changelog with git-cliff
        id: generate_changelog
        run: |
          git-cliff --config .git-cliff.toml --tag v${{ env.VERSION }} > CHANGELOG.md
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat CHANGELOG.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body: ${{ env.CHANGELOG }}
          generate_release_notes: false
